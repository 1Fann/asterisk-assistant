name: Build, verify and release
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify backend, policy and signed release
        run: |
          for file in assets/runtime/*.sh; do sh -n "$file"; done
          python3 check-backend.py assets/runtime
          python3 tools/callerid-format/download_dependency.py
          python3 tools/callerid-format/check_format.py
          mkdir -p .work/policy
          javac -d .work/policy src/com/fann/asterisk/HealthPolicy.java tests/HealthPolicyChecks.java
          java -cp .work/policy com.fann.asterisk.HealthPolicyChecks
          python3 tools/audit_public.py
          python3 tools/verify_release.py

  android:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android SDK components
        shell: pwsh
        run: sdkmanager 'platforms;android-35' 'build-tools;36.0.0'
      - name: Build with a disposable CI signing key
        shell: pwsh
        run: ./build.ps1 -SdkRoot $env:ANDROID_HOME -JavaHome $env:JAVA_HOME

  release:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [checks, android]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Publish signed APK and corresponding source
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 tools/audit_public.py
          python3 tools/verify_release.py
          python3 tools/make_source_zip.py
          tag=$(python3 -c 'import json,pathlib; p=next(pathlib.Path(".work/release").glob("*.apk")); m=next(json.loads(f.read_text()) for f in pathlib.Path("releases").glob("*/manifest.json") if json.loads(f.read_text())["name"]==p.name); print("v"+m["version"])')
          if gh release view "$tag" >/dev/null 2>&1; then
            echo 'Release already exists; published assets are retained.'
            exit 0
          fi
          gh release create "$tag" .work/release/*.apk .work/release/*-source.zip .work/release/SHA256SUMS \
            --target "$GITHUB_SHA" --title "$GH_REPO $tag" --notes-file "releases/$tag/NOTES.md"
